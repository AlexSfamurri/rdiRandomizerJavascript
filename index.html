<!DOCTYPE html>
<html>
    <head>
        <title>
            Red Dragon Inn Random Character Picker
        </title>
        <link rel="stylesheet" href="./styles/style.css" />
    </head>
    <body>
        <header>
            <h1>
                Red Dragon Inn Random Character Picker
            </h1>
        </header>
        <main>
            <div id="filterOptions">
                <section id="heroVSVillain" >
                    <h3>
                        Hero or Villains
                    </h3>
                    <div>
                        <input type="checkbox" id="hero" name="hero" value="hero" />

                    </div>
                    <div>
                        <input type="checkbox" id="villain" name="villain" value="villain"/>
                        <label for="villain">Villain</label>
                    </div>
                </section>
                <section id="sources" >
                    <h3>
                        Source
                    </h3>
                    <div id="board" >
                        <!-- <div> -->
                            <input type="checkbox" id="rdi3" name="rdi3" value="rdi3"/>
                            <label for="rdi3">RDI3</label>
                        <!-- </div> -->
                        <!-- <div> -->
                            <input type="checkbox" id="rdi5" name="rdi5" value="rdi5" />
                            <label for="rdi5">RDI5</label>
                        <!-- </div> -->
                        <!-- <div> -->
                            <input type="checkbox" id="rdi6" name="rdi6" value="rdi6"/>
                            <label for="rdi6">RDI6</label>
                        <!-- </div> -->
                        <!-- <div> -->
                            <input type="checkbox" id="rdi7" name="rdi7" value="rdi7" />
                            <label for="rdi7">RDI7</label>
                        <!-- </div> -->
                        <!-- <div> -->
                            <input type="checkbox" id="rdi8" name="rdi8" value="rdi8" />
                            <label for="rdi8">RDI8</label>
                        <!-- </div> -->
                        <!-- <div> -->
                            <input type="checkbox" id="rdi9" name="rdi9" value="rdi9" />
                            <label for="rdi9">RDI9</label>
                        <!-- </div> -->
                        <!-- <div> -->
                            <input type="checkbox" id="rdi10" name="rdi10" value="rdi10"/>
                            <label for="rdi10">RDI10</label>
                        <!-- </div> -->
                        <!-- <div> -->
                            <input type="checkbox" id="allies" name="allies" value="allies" />
                            <label for="allies">Allies</label>
                        <!-- </div> -->
                        <!-- <div> -->
                            <input type="checkbox" id="smorgasbox" name="smorgasbox" value="smorgasbox"/>
                            <label for="smorgasbox">Smorgasbox</label>
                        <!-- </div> -->
                    </div>
                    
                </div>
            </section>
            <div id="inputArea">
                <label>How many players?</label>
                <input id="playerCountInput" type="number"> 
                <!-- <button id="submitBtn">Submit</button> -->
            </div>
            <hr>
            <div id="displayArea">
                <p id="displayCharacters">
                </p>
            </div>
        </main>
        

        <footer>
            <script src="classes/deckClass.js" type="module" defer></script>
            <script src="classes/characterClass.js" type="module" defer></script>
            <script src="deckPrep.js" type="module" defer></script>
            <script src="dealToPlayers.js" type="module" defer></script>
            <script src="index.js" type="module" defer></script>

        </footer>
    </body>
</html>
